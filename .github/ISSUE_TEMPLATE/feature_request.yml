name: 功能建议
description: 对写作体验与能力的改进建议
labels: [enhancement]
body:
  - type: textarea
    id: author-task
    attributes:
      label: 解决的作者任务
      description: 哪个写作环节现在不顺手？你现在怎么绕？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 影响面（可多选）
      options:
        - label: 涉及数据写入（书稿/世界书/素材库）
        - label: 涉及模型调用
        - label: 涉及服务端
        - label: 涉及移动 UI / 中文输入 / 生命周期
        - label: 涉及原生存储 / 文件 / 网络
        - label: 涉及 Android 宿主或构建
  - type: textarea
    id: ownership
    attributes:
      label: 现有实现与数据 owner
      description: 已搜索到的 Pinax 路径、读写 owner；未知可写“待定位”，不要另造移动副本。
  - type: textarea
    id: acceptance
    attributes:
      label: 验收与未测范围
      description: 分开写 Web、Android sync、APK、真机和真实模型证据。
